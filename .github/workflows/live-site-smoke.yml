name: Verify actual live game
on:
  pull_request:
  workflow_run:
    workflows: ["Publish Browser Build"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=e2e/live.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-live-site-screenshots
          path: test-results/
          retention-days: 14
