name: Diagnose live GitHub Pages
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect configured GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '=== Pages API metadata ==='
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status,build_type,html_url,cname,source,https_enforced}' || true
          echo '=== Latest publish workflow executions ==='
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?per_page=12" \
            --jq '.workflow_runs[] | {id,event,status,conclusion,head_sha,created_at,html_url}' || true
      - name: Probe the public URL, headers, and root response
        run: |
          echo '=== Root ==='
          curl -sSL --connect-timeout 10 --max-time 25 -D /tmp/conquest-headers \
            -o /tmp/conquest-response \
            -w 'HTTP:%{http_code} URL:%{url_effective} IP:%{remote_ip} SIZE:%{size_download}\n' \
            https://statego2.github.io/Conquest/ || true
          sed -n '1,28p' /tmp/conquest-headers || true
          head -c 850 /tmp/conquest-response || true
          echo
          echo '=== Does public root contain compiled playable game? ==='
          if grep -q 'conquest-build' /tmp/conquest-response; then
            echo 'VERIFIED_COMPILED=true'
          else
            echo 'VERIFIED_COMPILED=false'
          fi
          echo
          echo '=== Wrong-case and parent origin ==='
          for url in https://statego2.github.io/ https://statego2.github.io/conquest/ ; do
            curl -sSL --connect-timeout 10 --max-time 20 -o /dev/null \
              -w 'HTTP:%{http_code} URL:%{url_effective}\n' "$url" || true
          done

      - name: Verify deployed game rather than raw Vite source
        run: |
          for attempt in $(seq 1 16); do
            curl -fsSL --connect-timeout 5 --max-time 15 \
              "https://statego2.github.io/Conquest/?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/live-verified.html || true
            if grep -q 'conquest-build' /tmp/live-verified.html 2>/dev/null && \
               ! grep -q 'src="/src/main.ts"' /tmp/live-verified.html; then
              echo 'PRODUCTION VERIFIED: GitHub URL serves compiled browser game'
              exit 0
            fi
            echo "Still old page: attempt ${attempt}/16"
            sleep 10
          done
          echo 'LIVE URL DOES NOT SERVE COMPILED GAME' >&2
          exit 1
