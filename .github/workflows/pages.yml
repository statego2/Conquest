name: Publish Browser Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: conquest-pages
  cancel-in-progress: true
jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build_type: ${{ steps.detect.outputs.build_type }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          echo "build_type=${MODE}" >> "${GITHUB_OUTPUT}"
          echo "Existing Pages mode: ${MODE}"
          if [[ "${MODE}" != "legacy" && "${MODE}" != "workflow" ]]; then exit 1; fi

  legacy:
    needs: mode
    if: needs.mode.outputs.build_type == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # IMPORTANT: no github-pages environment! Legacy branch publishing must
    # not be blocked by approval/protection rules for Actions deployments.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build and test source code
        run: npm run check
        env:
          GITHUB_PAGES: 'true'
      - name: Inline compiled JS/CSS into the actual Pages entry
        run: node scripts/build-portable.mjs dist dist/Conquest-Portable.html
      - name: Replace public root with playable HTML
        run: |
          cp dist/Conquest-Portable.html index.html
          grep -q 'conquest-build' index.html
          if grep -q 'src="/src/main.ts"' index.html; then
            echo 'Error: public entry still links raw TypeScript' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production HTML already up-to-date'
          else
            git commit -m 'Publish compiled Conquest game [skip ci]'
            git push origin HEAD:main
          fi
      - name: Request a fresh legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"; then
              echo 'Requested GitHub Pages branch rebuild'
              exit 0
            fi
            sleep 5
          done
          echo 'Unable to schedule legacy Pages rebuild' >&2
          exit 1
      - name: Confirm real public URL serves compiled game
        run: |
          for attempt in $(seq 1 25); do
            curl -sSL --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://statego2.github.io/Conquest/?deployment=${GITHUB_SHA}-${attempt}" \
              -o /tmp/conquest-live.html || true
            if grep -q 'conquest-build' /tmp/conquest-live.html 2>/dev/null; then
              if grep -q 'src="/src/main.ts"' /tmp/conquest-live.html; then
                echo 'Unexpected raw source entry'; exit 1
              fi
              echo 'SUCCESS: public link now delivers playable compiled game'
              exit 0
            fi
            echo "Waiting for Pages to publish... ${attempt}/25"
            sleep 10
          done
          echo 'ERROR: public Pages still serves stale source HTML' >&2
          exit 1

  workflow:
    needs: mode
    if: needs.mode.outputs.build_type == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
